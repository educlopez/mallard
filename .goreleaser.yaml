version: 2

project_name: mallard

before:
  hooks:
    - go mod tidy

builds:
  - main: .
    binary: mallard
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X main.version={{.Version}}

archives:
  - formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - README.md
      - LICENSE*

checksum:
  name_template: "checksums.txt"

signs:
  - cmd: cosign
    certificate: "${artifact}.pem"
    args:
      - sign-blob
      - "--output-certificate=${certificate}"
      - "--output-signature=${signature}"
      - "--new-bundle-format=false"
      - "${artifact}"
      - "--yes"
    artifacts: checksum
    output: true

changelog:
  use: git
  sort: asc
  groups:
    - title: Features
      regexp: '^.*?feat(\(.+\))??!?:.+$'
      order: 0
    - title: Bug Fixes
      regexp: '^.*?fix(\(.+\))??!?:.+$'
      order: 1
    - title: Refactor
      regexp: '^.*?refactor(\(.+\))??!?:.+$'
      order: 2
    - title: Others
      order: 999
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^ci:"
      - "^chore:"

release:
  draft: false
  prerelease: auto

homebrew_casks:
  - repository:
      owner: educlopez
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    name: mallard
    homepage: "https://mallard.educalvolopez.com"
    description: "Claude Code toolkit for PrestaShop development — skills, commands, and agents."
    commit_msg_template: "chore: update mallard cask to {{ .Tag }}"
    # Strip the Gatekeeper quarantine flag so the unsigned binary runs on first launch.
    hooks:
      post:
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/mallard"]
          end

scoops:
  - repository:
      owner: educlopez
      name: scoop-bucket
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    name: mallard
    homepage: "https://mallard.educalvolopez.com"
    description: "Claude Code toolkit for PrestaShop development — skills, commands, and agents."
    license: MIT
    commit_msg_template: "chore: update mallard to {{ .Tag }}"
